name: mean-cv-sensitivity-map

on:
  push:
    branches: [market-chi-architecture]
    paths:
      - "tools/mean_cv_sensitivity_map.py"
      - ".github/workflows/mean-cv-sensitivity.yml"
  workflow_dispatch:

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [300, 600, 1200, 2400]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run sensitivity map
        run: python tools/mean_cv_sensitivity_map.py --n ${{ matrix.n }} --replicates 50 --bic-margin 6 --seed0 12000 --out qualification/mean_cv_sensitivity_n${{ matrix.n }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mean-cv-sensitivity-n${{ matrix.n }}
          path: qualification/mean_cv_sensitivity_n${{ matrix.n }}.json
