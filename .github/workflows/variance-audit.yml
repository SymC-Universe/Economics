name: variance-admission-audit

on:
  push:
    branches: [market-chi-architecture]
    paths:
      - "market_chi/variance_diagnostics.py"
      - "tools/variance_admission_audit.py"
      - "tests/test_variance_diagnostics.py"
      - ".github/workflows/variance-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Qualification tests
        run: python -m pytest -q tests/test_variance_diagnostics.py tests/test_native_engine.py
      - name: Synthetic variance admission audit
        run: python tools/variance_admission_audit.py --replicates 200 --n 1200 --bic-margin 6 --seed0 2000 --out qualification/variance_admission_audit_ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: variance-admission-audit
          path: qualification/variance_admission_audit_ci.json
