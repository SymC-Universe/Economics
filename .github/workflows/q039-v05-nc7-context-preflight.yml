name: Q039 v0.5 NC7 Derived-Context Preflight

on:
  push:
    branches:
      - market-chi-architecture
    paths:
      - "market_chi/q039_nc7_context_v05.py"
      - "tests/test_q039_nc7_context_v05.py"
      - "tools/q039_nc7_context_preflight_v05.py"
      - ".github/workflows/q039-v05-nc7-context-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-derived-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run v0.5 derived-context unit tests
        run: python -m pytest -q tests/test_q039_nc7_context_v05.py
      - name: Run all-200-world synthetic implementation preflight
        run: python tools/q039_nc7_context_preflight_v05.py
      - name: Upload derived-context preflight result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q039-v05-nc7-derived-context-preflight
          path: qualification/results/q039_v05_nc7_context_preflight/result.json
          if-no-files-found: error
