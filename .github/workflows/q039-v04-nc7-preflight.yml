name: Q039 v0.4 NC7 Implementation Preflight

on: []  # PROGRAM COST LOCK: GitHub Actions disabled; use local/Kaggle compute only.
permissions:
  contents: read

jobs:
  qualify-nc7-plumbing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run NC7 unit tests
        run: python -m pytest -q tests/test_q039_nc7_v04.py
      - name: Run NC7 synthetic timing preflight
        run: python tools/q039_nc7_preflight_v04.py
      - name: Upload NC7 preflight result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q039-v04-nc7-preflight
          path: qualification/results/q039_v04_nc7_preflight/result.json
          if-no-files-found: warn
