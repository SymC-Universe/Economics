name: Q039 v0.4 Synthetic Layer R Qualification

on: []  # PROGRAM COST LOCK: GitHub Actions disabled; use local/Kaggle compute only.
permissions:
  contents: read

jobs:
  qualify-layer-r:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run Q039 v0.4 Layer-R unit tests
        run: python -m pytest -q tests/test_q039_layer_r_v04.py
      - name: Run frozen Layer-R known truths
        run: python tools/q039_synthetic_layer_r_v04.py
      - name: Upload qualification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q039-v04-synthetic-layer-r
          path: qualification/results/q039_v04_synthetic_layer_r/result.json
          if-no-files-found: warn
