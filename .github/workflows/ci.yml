name: market-chi-ci

on:
  push:
    branches: [market-chi-architecture]
  pull_request:
    branches: [main, market-chi-architecture]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run production qualification tests
        run: python -m pytest -q
